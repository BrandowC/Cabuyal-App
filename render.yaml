# Blueprint de Render: un solo servicio web (API + web compilada) y una base Postgres.
# Dashboard de Render > New > Blueprint > elige este repositorio.
services:
  - type: web
    name: cabuyal-app
    runtime: node
    plan: starter            # plan de pago: no se duerme
    region: oregon
    healthCheckPath: /api/health
    buildCommand: npm install --include=dev --prefix server && npm install --include=dev --prefix web && npm run build --prefix web && npm run prisma:generate --prefix server
    startCommand: npm run prisma:deploy --prefix server && npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cabuyal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RETENTION_MONTHS
        value: "8"
      - key: VITE_WHATSAPP_NUMBER
        value: "573043800967"

databases:
  - name: cabuyal-db
    plan: basic-256mb
    region: oregon
    databaseName: cabuyal
    user: cabuyal
